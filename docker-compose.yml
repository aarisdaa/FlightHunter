services:
  postgres:
    image: postgres:16
    container_name: flighthunter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: flighthunter
      POSTGRES_PASSWORD: flighthunter
      POSTGRES_DB: flighthunter
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: